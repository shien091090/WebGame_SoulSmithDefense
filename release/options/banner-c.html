<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>橫幅 C — 魂柱共鳴</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 C「魂柱共鳴」: 暮色草地正中一根放大的魂柱(drawPillar), 共鳴範圍(drawPillarRange)攤開成大圓,
// 共鳴線(drawResonanceLine)連到箭塔、步兵、石魔像與魂匠; 圓外散落幾件地上的魂件(drawGroundPart)。
// 標題置中上方。左下角(x < 504、y > 540)只有草地與路面。
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1680, H = 720, TAU = Math.PI * 2, K = 2;
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
  var IDLE = { hitAge: 0.2, hitDuration: 0.2, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', attackAngle: 0, targeted: false };
  function st(o) { var r = {}, k; for (k in IDLE) r[k] = IDLE[k]; for (k in o) r[k] = o[k]; return r; }
  function unit(o) { var r = { x: 0, y: 0, moving: false, charging: false, rooted: false, healing: false, resonating: true, returning: false, hp: 10, maxHp: 10 }, k; for (k in o) r[k] = o[k]; return st(r); }
  function at(x, y, k, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); fn(); ctx.restore(); }
  function shadow(rx, ry, oy) { ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(0, oy, rx, ry, 0, 0, TAU); ctx.fill(); }
  function title(cx, cy, size) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.strokeStyle = '#0c2420'; ctx.lineWidth = size * 0.16; ctx.strokeText('魂匠守衛者', cx, cy);
    ctx.shadowColor = 'transparent';
    var g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
    g.addColorStop(0, '#fff1a8'); g.addColorStop(0.55, '#ffd24a'); g.addColorStop(1, '#e0902a');
    ctx.fillStyle = g; ctx.fillText('魂匠守衛者', cx, cy);
    ctx.restore();
  }

  // ---- 背景: 遊戲草地 + 路(2 倍), 壓上暮色青 ----
  ctx.save(); ctx.scale(K, K);
  Art.drawBackground(ctx, { paths: [[[0, 300], [250, 300], [250, 120], [840, 120]]] });
  ctx.restore();
  var dusk = ctx.createLinearGradient(0, 0, 0, H);
  dusk.addColorStop(0, 'rgba(8,26,40,0.85)'); dusk.addColorStop(0.4, 'rgba(8,30,40,0.45)'); dusk.addColorStop(1, 'rgba(6,20,28,0.55)');
  ctx.fillStyle = dusk; ctx.fillRect(0, 0, W, H);

  // ---- 共鳴範圍: 魂柱範圍 r150 放大 2 倍 = 半徑 300, 中心 (860,490) → 圓頂 y 190(標題之下), 左緣不進左下角 ----
  var PX = 860, PY = 490, KIND = 'healRay';
  ctx.save(); ctx.scale(K, K);
  Art.drawPillarRange(ctx, { x: PX / K, y: PY / K, radius: 150, kinds: [KIND], changeAge: 0.5, changeDuration: 0.5 });
  ctx.restore();
  // 柱心光暈
  var glow = ctx.createRadialGradient(PX, PY - 50, 10, PX, PY - 50, 220);
  glow.addColorStop(0, 'rgba(82,227,154,0.45)'); glow.addColorStop(1, 'rgba(82,227,154,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // ---- 接收者(畫布座標)與共鳴線 ----
  var GEM = [PX, PY - 20 - 11 * 4.4];   // 魂柱晶石(單位座標 y −11)
  var recv = [[640, 380], [1080, 370], [1060, 640], [680, 620]];
  ctx.save(); ctx.scale(K, K);
  recv.forEach(function (r) { Art.drawResonanceLine(ctx, { x1: GEM[0] / K, y1: GEM[1] / K, x2: r[0] / K, y2: r[1] / K, kind: KIND, active: true }); });
  ctx.restore();

  // ---- 圓外地上的魂件(可撿) ----
  [['thunderOrb', 300, 330], ['frostSmash', 1440, 330], ['shop', 360, 440], ['pierce', 1470, 560]].forEach(function (p) {
    at(p[1], p[2], 3, function () { Art.drawGroundPart(ctx, { x: 0, y: 0, item: p[0], permanent: p[0] === 'shop', frozen: true, life: 10, maxLife: 10, spawnAge: 0.6, spawnDuration: 0.6, targeted: false }); });
  });

  // ---- 單位(依 y 小到大) ----
  at(1080, 370, 2.8, function () { shadow(13, 3, 16); Art.drawSoldier(ctx, unit({ healing: true })); });
  at(1080, 370 - 36 * 2.8, 2.8, function () { Art.drawSoulSlots(ctx, { x: 0, y: 0, slots: ['melee'], virtual: [{ kind: KIND, used: true }] }); });
  at(640, 380, 2.6, function () { Art.drawCrossbow(ctx, unit({})); });
  at(640, 380 - 44 * 2.6, 2.6, function () { Art.drawSoulSlots(ctx, { x: 0, y: 0, slots: ['ranged'], virtual: [{ kind: KIND, used: true }] }); });
  // 主角: 魂柱(放大 4.4 倍)
  at(PX, PY - 20, 4.4, function () { shadow(16, 3.5, 17); Art.drawPillar(ctx, st({ x: 0, y: 0, kinds: [KIND], moving: false, charging: false, rooted: false })); });
  at(PX, PY - 20 - 38 * 4.4 + 40, 3, function () { Art.drawSoulSlots(ctx, { x: 0, y: 0, slots: [KIND], virtual: [] }); });
  at(680, 620, 4, function () { Art.drawPlayer(ctx, { x: 0, y: 0, moving: false, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', resonating: true, stealing: false, holdingFlag: false, handItem: 'heal' }); });
  at(1060, 640, 2.6, function () { shadow(22, 4, 26); Art.drawGolem(ctx, unit({ team: 'ally' })); });

  title(840, 112, 128);
})();
</script>
</body>
</html>
