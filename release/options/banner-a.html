<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>魂匠守衛者 橫幅 A — 守城戰場</title>
<style>body{margin:0;overflow:hidden;background:#2e4733}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 A: 遊戲戰場放大 2 倍的一景 — 怪從左上的路進攻, 雷霆魔王被魂匠拔走魂件、被衝鋒箭塔砍中; 魂柱、兵、石像守著右側主堡
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), A = window.Art;
  var W = 1680, H = 720, TAU = Math.PI * 2;
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';

  function title(cx, cy, size) {
    var s = '魂匠守衛者';
    ctx.save();
    ctx.font = '900 ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var w = ctx.measureText(s).width, pw = w + size * 0.9, ph = size * 1.42, r = ph * 0.32;
    var x0 = cx - pw / 2, y0 = cy - ph / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0); ctx.lineTo(x0 + pw - r, y0); ctx.arcTo(x0 + pw, y0, x0 + pw, y0 + r, r);
    ctx.lineTo(x0 + pw, y0 + ph - r); ctx.arcTo(x0 + pw, y0 + ph, x0 + pw - r, y0 + ph, r);
    ctx.lineTo(x0 + r, y0 + ph); ctx.arcTo(x0, y0 + ph, x0, y0 + ph - r, r);
    ctx.lineTo(x0, y0 + r); ctx.arcTo(x0, y0, x0 + r, y0, r); ctx.closePath();
    ctx.fillStyle = 'rgba(16,20,30,0.82)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,74,0.85)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#2a1a00'; ctx.lineWidth = size * 0.13;
    ctx.strokeText(s, cx, cy + size * 0.04);
    var g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
    g.addColorStop(0, '#fff3b8'); g.addColorStop(0.5, '#ffd24a'); g.addColorStop(1, '#e8962a');
    ctx.fillStyle = g; ctx.fillText(s, cx, cy + size * 0.04);
    ctx.restore();
  }

  // ---- 場景: 設計座標 x 200~1040、y 110~470 放大 2 倍 ----
  ctx.save();
  ctx.translate(-400, -220); ctx.scale(2, 2);
  A.drawBackground(ctx, { paths: [[[288, 48], [288, 336], [900, 336]]] });

  // 魂柱範圍 + 共鳴線(地面層)
  A.drawPillarRange(ctx, { x: 640, y: 420, radius: 90, kinds: ['frost'] });
  A.drawResonanceLine(ctx, { x1: 640, y1: 410, x2: 760, y2: 410, kind: 'frost', active: true });

  // 主堡(只取城體, 剪掉下方的血量牌)
  ctx.save(); ctx.beginPath(); ctx.rect(900 - 70, 336 - 80, 140, 80 + 26); ctx.clip();
  A.drawCastle(ctx, { x: 900, y: 336, hp: 20, maxHp: 20 });
  ctx.restore();

  // 敵人: 沿左側路往下走
  A.drawEnemy(ctx, { x: 288, y: 170, type: 'imp', moving: true, hp: 1, maxHp: 1 });
  A.drawEnemy(ctx, { x: 288, y: 228, type: 'archer', moving: true, hp: 1, maxHp: 1 });
  A.drawEnemy(ctx, { x: 288, y: 286, type: 'brute', moving: true, hp: 1, maxHp: 1 });
  A.drawEnemy(ctx, { x: 370, y: 336, type: 'ice', moving: true, hp: 1, maxHp: 1 });

  // 我方: 魂柱、共鳴中的箭塔、上方另一座箭塔、兵、石像
  A.drawPillar(ctx, { x: 640, y: 410, kinds: ['frost'] });
  A.drawCrossbow(ctx, { x: 760, y: 410, resonating: true });
  A.drawCrossbow(ctx, { x: 690, y: 245 });
  A.drawProjectile(ctx, { x: 610, y: 270, angle: Math.atan2(320 - 245, 450 - 690), owner: 'ally', kind: 'arrow' });
  A.drawGolem(ctx, { x: 760, y: 330, team: 'ally', moving: true, hp: 1, maxHp: 1 });
  A.drawSoldier(ctx, { x: 640, y: 330, moving: true, hp: 1, maxHp: 1 });
  A.drawSoldier(ctx, { x: 680, y: 344, moving: true, hp: 1, maxHp: 1 });

  // 雷霆魔王 + 頭上的魂件槽(被搶的那格)
  A.drawEnemy(ctx, { x: 450, y: 336, type: 'bossThunder', moving: true, hp: 1, maxHp: 1 });
  A.drawSoulSlots(ctx, { x: 450, y: 336 - 36 - 20, slots: ['shock', 'heal'] });
  // 衝鋒箭塔撞上魔王 + 金色刀光
  A.drawCrossbow(ctx, { x: 545, y: 336, charging: true, moving: true });
  A.drawMeleeSlash(ctx, { x: 510, y: 336, angle: Math.PI, age: 0.12, duration: 0.25, kind: 'melee', team: 'ally' });

  // 魂匠: 正在拔魔王的電擊魂件(金色連線連到槽列第 1 格)
  A.drawStealLink(ctx, { x1: 575, y1: 250, x2: 450 - 20 + 10, y2: 280, progress: 0.65 });
  A.drawPlayer(ctx, { x: 575, y: 250, stealing: true, stealProgress: 0.65 });
  ctx.restore();

  // ---- 標題: 頂端壓暗 + 名牌 ----
  var tg = ctx.createLinearGradient(0, 0, 0, 250);
  tg.addColorStop(0, 'rgba(10,14,22,0.75)'); tg.addColorStop(1, 'rgba(10,14,22,0)');
  ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 250);
  title(840, 112, 118);
})();
</script>
</body>
</html>
