<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>橫幅 A — 守住主堡</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 A「守住主堡」: 遊戲的草地 + 路線(drawBackground)放大 2.4 倍, 左邊敵人沿路排排走來, 右邊我方部隊擋在主堡前;
// 標題「魂匠守衛者」置中上方。左下角(x < 504、y > 540)只有草地與岔路。
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1680, H = 720, TAU = Math.PI * 2, K = 2.4;   // 世界座標 × 2.4 = 畫布座標
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
  var IDLE = { hitAge: 0.2, hitDuration: 0.2, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', attackAngle: 0, targeted: false };
  function st(o) { var r = {}, k; for (k in IDLE) r[k] = IDLE[k]; for (k in o) r[k] = o[k]; return r; }
  // 主堡: 函式在城牆下半畫血量牌(含字); 牌子那一條(單位座標 y 27~49)剪掉, 改補畫同色城牆
  function castleNoPlate(x, y) {
    var s = st({ x: x, y: y, hp: 20, maxHp: 20, hitDuration: 0.3, hitAge: 0.3 });
    ctx.save(); ctx.beginPath(); ctx.rect(x - 80, y - 80, 160, 107); ctx.clip(); Art.drawCastle(ctx, s); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(x - 80, y + 49, 160, 30); ctx.clip(); Art.drawCastle(ctx, s); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(x - 80, y + 27, 160, 22); ctx.clip();
    ctx.translate(x, y);
    ctx.fillStyle = '#5d6272'; rrect(-48, -34, 96, 86, 6); ctx.fill();
    ctx.fillStyle = '#8d93a3'; rrect(-45, -31, 90, 80, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-25, 38); ctx.lineTo(25, 38); ctx.stroke();
    ctx.restore();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function title(cx, cy, size) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.strokeStyle = '#2a1a00'; ctx.lineWidth = size * 0.16; ctx.strokeText('魂匠守衛者', cx, cy);
    ctx.shadowColor = 'transparent';
    var g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
    g.addColorStop(0, '#fff1a8'); g.addColorStop(0.55, '#ffd24a'); g.addColorStop(1, '#e0902a');
    ctx.fillStyle = g; ctx.fillText('魂匠守衛者', cx, cy);
    ctx.restore();
  }

  // ---- 世界層(2.4 倍) ----
  ctx.save(); ctx.scale(K, K);
  // 主路: 從左邊畫面外進來, 水平走到主堡; 岔路: 從左下進來在 x 180 併入(左下角只有路面與草地)
  Art.drawBackground(ctx, { paths: [[[0, 190], [600, 190]], [[0, 282], [180, 282], [180, 190], [600, 190]]] });
  ctx.restore();
  // 上緣壓暗(給標題一塊安靜的底)
  var top = ctx.createLinearGradient(0, 0, 0, 300);
  top.addColorStop(0, 'rgba(10,14,22,0.72)'); top.addColorStop(1, 'rgba(10,14,22,0)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 300);

  ctx.save(); ctx.scale(K, K);
  // 魂柱 → 箭塔的共鳴線(冰霜)
  Art.drawResonanceLine(ctx, { x1: 330, y1: 135, x2: 404, y2: 135, kind: 'frost', active: true });
  // 主堡(右, 中心 (600,190) → 畫布 (1440,456))
  castleNoPlate(600, 190);
  Art.drawSoulSlots(ctx, { x: 600, y: 114, slots: ['shop', 'melee'], virtual: [] });
  // 敵人排排走來(依 y 小到大畫)
  var foes = [['imp', 74, 189], ['archer', 114, 192], ['ice', 154, 187], ['thunder', 196, 192], ['healer', 240, 186], ['drummer', 285, 191], ['brute', 334, 188]];
  foes.sort(function (a, b) { return a[2] - b[2]; }).forEach(function (f) {
    Art.drawEnemy(ctx, st({ x: f[1], y: f[2], type: f[0], hp: 10, maxHp: 10, moving: true, slowed: f[0] === 'drummer', healing: false, swift: false, stunAge: 1, stunDuration: 1 }));
  });
  // 我方: 魂柱、箭塔、步兵、石魔像
  Art.drawPillar(ctx, st({ x: 330, y: 135, kinds: ['frost'], moving: false, charging: false, rooted: false }));
  Art.drawSoulSlots(ctx, { x: 330, y: 97, slots: ['frost'], virtual: [] });
  Art.drawCrossbow(ctx, st({ x: 404, y: 135, moving: false, charging: false, rooted: false, resonating: true }));
  Art.drawSoulSlots(ctx, { x: 404, y: 91, slots: ['ranged'], virtual: [{ kind: 'frost', used: true }] });
  Art.drawSoldier(ctx, st({ x: 424, y: 178, hp: 10, maxHp: 10, moving: false, charging: false, rooted: false, healing: false, resonating: false, returning: false }));
  Art.drawGolem(ctx, st({ x: 476, y: 192, team: 'ally', hp: 10, maxHp: 10, moving: false, charging: false, rooted: false, healing: false, resonating: false, returning: false }));
  Art.drawSoldier(ctx, st({ x: 430, y: 206, hp: 10, maxHp: 10, moving: false, charging: false, rooted: false, healing: false, resonating: false, returning: false, attackKind: 'melee', attackAge: 0.05, attackDuration: 0.25, attackAngle: Math.PI }));
  // 冰箭飛向前排敵人
  [[380, 153], [358, 169]].forEach(function (p) {
    Art.drawProjectile(ctx, { x: p[0], y: p[1], angle: Math.atan2(53, -70), owner: 'ally', kind: 'ice' });
  });
  Art.drawMeleeSlash(ctx, { x: 352, y: 204, angle: Math.PI, kind: 'melee', team: 'ally', age: 0.1, duration: 0.25 });
  ctx.restore();

  // 主角: 玩家魂匠放大 4.2 倍, 捧著冰箭魂件站在主堡前(畫布 (1100,604))
  ctx.save(); ctx.translate(1100, 604); ctx.scale(4.2, 4.2);
  Art.drawPlayer(ctx, { x: 0, y: 0, moving: false, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', resonating: false, stealing: false, holdingFlag: false, handItem: 'iceArrow' });
  ctx.restore();

  // 標題: 置中上方
  title(840, 118, 132);
})();
</script>
</body>
</html>
