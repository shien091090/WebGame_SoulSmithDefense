<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖示 B — 雷霆魔王</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 B「雷霆魔王」: 第 4 關 Boss(drawEnemy type bossThunder)放大成主體, 雷雲紫背景 + 身後電擊紫光暈; 不放字
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 512, H = 512, CX = 256, CY = 262, TAU = Math.PI * 2;
  // 背景: 雷雲深紫, 上亮下暗
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a4a'); bg.addColorStop(1, '#0e0818');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // 背景遠處的閃電(淡, 只在中間區之外當氛圍, 不搶主體)
  function bolt(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.fillStyle = '#d27cff';
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(-8, 2); ctx.lineTo(0, 2); ctx.lineTo(-5, 20); ctx.lineTo(9, -4); ctx.lineTo(1, -4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  bolt(70, 120, 2.2, 0.28); bolt(450, 150, 1.8, 0.24); bolt(420, 420, 1.6, 0.18); bolt(90, 400, 1.5, 0.16);
  // 身後光暈: 電擊紫 → 透明
  var g = ctx.createRadialGradient(CX, CY, 30, CX, CY, 250);
  g.addColorStop(0, 'rgba(210,124,255,0.55)'); g.addColorStop(0.5, 'rgba(120,60,200,0.25)'); g.addColorStop(1, 'rgba(60,30,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 放射電光(8 道, 從光暈中心往外)
  ctx.save(); ctx.translate(CX, CY);
  for (var i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    ctx.fillStyle = i % 2 ? 'rgba(255,210,74,0.10)' : 'rgba(210,124,255,0.14)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, -240); ctx.lineTo(22, -240); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // 主體: 雷霆魔王, 72×72 放大 5.4 倍(約 389 見方, 中心 (256,262) → y 68~456、x 62~450, 都在中間 80% 內)
  var K = 5.4;
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(K, K);
  // 腳下影子
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(0, 34, 30, 4.5, 0, 0, TAU); ctx.fill();
  Art.drawEnemy(ctx, {
    x: 0, y: 0, type: 'bossThunder', hp: 60, maxHp: 60, moving: true, slowed: false, healing: false, targeted: false,
    hitAge: 0.2, hitDuration: 0.2, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', attackAngle: 0,
    stunAge: 1, stunDuration: 1
  });
  ctx.restore();
})();
</script>
</body>
</html>
