<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>橫幅 B — 魔王對決</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 B「魔王對決」: 雷雲夜色下, 左半是放大的雷霆魔王(drawEnemy bossThunder)帶著小怪, 右半是魂匠帶隊迎戰;
// 中間刀光與電光交鋒。標題置中上方。左下角(x < 504、y > 540)只有夜色草地。
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1680, H = 720, TAU = Math.PI * 2, K = 2.4;
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
  var IDLE = { hitAge: 0.2, hitDuration: 0.2, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', attackAngle: 0, targeted: false };
  function st(o) { var r = {}, k; for (k in IDLE) r[k] = IDLE[k]; for (k in o) r[k] = o[k]; return r; }
  function unit() { return { moving: false, charging: false, rooted: false, healing: false, resonating: false, returning: false, hp: 10, maxHp: 10 }; }
  function mix(a, b) { var k; for (k in b) a[k] = b[k]; return a; }
  // 在 (x, y) 以 k 倍畫一個以原點為中心的單位
  function at(x, y, k, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); fn(); ctx.restore(); }
  function shadow(rx, ry, oy) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, oy, rx, ry, 0, 0, TAU); ctx.fill(); }
  function title(cx, cy, size) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 6;
    ctx.strokeStyle = '#1a0a24'; ctx.lineWidth = size * 0.16; ctx.strokeText('魂匠守衛者', cx, cy);
    ctx.shadowColor = 'transparent';
    var g = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2);
    g.addColorStop(0, '#fff1a8'); g.addColorStop(0.55, '#ffd24a'); g.addColorStop(1, '#e0902a');
    ctx.fillStyle = g; ctx.fillText('魂匠守衛者', cx, cy);
    ctx.restore();
  }

  // ---- 背景: 遊戲草地 + 一條橫貫的路, 再壓上雷雲夜色 ----
  ctx.save(); ctx.scale(K, K);
  Art.drawBackground(ctx, { paths: [[[0, 205], [700, 205]]] });
  ctx.restore();
  var night = ctx.createLinearGradient(0, 0, 0, H);
  night.addColorStop(0, 'rgba(26,12,52,0.92)'); night.addColorStop(0.45, 'rgba(26,12,52,0.55)'); night.addColorStop(1, 'rgba(12,6,24,0.62)');
  ctx.fillStyle = night; ctx.fillRect(0, 0, W, H);
  // 魔王身後的紫色光暈 / 我方身後的暖金光暈(兩邊陣營各一種光)
  var gl = ctx.createRadialGradient(650, 400, 40, 650, 400, 420);
  gl.addColorStop(0, 'rgba(210,124,255,0.45)'); gl.addColorStop(1, 'rgba(210,124,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  var gr = ctx.createRadialGradient(1220, 460, 40, 1220, 460, 380);
  gr.addColorStop(0, 'rgba(255,176,32,0.32)'); gr.addColorStop(1, 'rgba(255,176,32,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // 天上的閃電(背景氛圍, 在標題兩側)
  function bolt(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a; ctx.fillStyle = '#d27cff';
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(-8, 2); ctx.lineTo(0, 2); ctx.lineTo(-5, 20); ctx.lineTo(9, -4); ctx.lineTo(1, -4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  bolt(330, 110, 3, 0.35); bolt(1380, 96, 2.6, 0.3); bolt(210, 230, 1.8, 0.2); bolt(1530, 250, 1.6, 0.18);

  // ---- 魔王陣營(左) ----
  at(300, 380, 2.6, function () { shadow(14, 3, 16); Art.drawEnemy(ctx, st({ x: 0, y: 0, type: 'thunder', hp: 10, maxHp: 10, moving: true, stunAge: 1, stunDuration: 1 })); });
  at(390, 470, 2.6, function () { shadow(14, 3, 16); Art.drawEnemy(ctx, st({ x: 0, y: 0, type: 'healer', hp: 10, maxHp: 10, moving: true, stunAge: 1, stunDuration: 1 })); });
  at(220, 470, 2.4, function () { shadow(13, 3, 15); Art.drawEnemy(ctx, st({ x: 0, y: 0, type: 'imp', hp: 10, maxHp: 10, moving: true, stunAge: 1, stunDuration: 1 })); });
  // 雷霆魔王: 72×72 放大 5 倍, 中心 (700,404) → x 520~880、y 224~584
  at(700, 404, 5, function () {
    shadow(30, 4.5, 34);
    Art.drawEnemy(ctx, st({ x: 0, y: 0, type: 'bossThunder', hp: 60, maxHp: 60, moving: true, slowed: false, healing: false, stunAge: 1, stunDuration: 1 }));
  });

  // ---- 我方(右) ----
  at(1440, 290, 2.6, function () { Art.drawCrossbow(ctx, st({ x: 0, y: 0, moving: false, charging: false, rooted: false, resonating: false })); });
  at(1420, 440, 2.6, function () { shadow(22, 4, 26); Art.drawGolem(ctx, st(mix(unit(), { x: 0, y: 0, team: 'ally' }))); });
  // 步兵朝魔王撲擊(近戰撲擊姿勢)
  at(990, 470, 2.8, function () { shadow(13, 3, 16); Art.drawSoldier(ctx, st(mix(unit(), { x: 0, y: 0, attackKind: 'melee', attackAge: 0.06, attackDuration: 0.25, attackAngle: Math.PI }))); });
  at(1040, 580, 2.8, function () { shadow(13, 3, 16); Art.drawSoldier(ctx, st(mix(unit(), { x: 0, y: 0 }))); });
  // 主角魂匠: 放大 4.6 倍, 捧著雷霆斬魂件
  at(1160, 480, 4.6, function () {
    Art.drawPlayer(ctx, { x: 0, y: 0, moving: false, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', resonating: true, stealing: false, holdingFlag: false, handItem: 'thunderSlash' });
  });

  // ---- 交鋒: 雷霆斬刀光 + 電擊鏈 + 火花(畫在雙方之間) ----
  at(900, 440, 3.2, function () { Art.drawMeleeSlash(ctx, { x: 0, y: 0, angle: Math.PI, kind: 'thunderSlash', team: 'ally', age: 0.1, duration: 0.25 }); });
  ctx.save(); ctx.scale(K, K);
  Art.drawShockChain(ctx, { owner: 'ally', age: 0.02, duration: 0.2, segments: [[1440 / K, 272 / K, 860 / K, 300 / K]] });
  ctx.restore();
  at(860, 300, 3, function () { Art.drawHitSpark(ctx, { x: 0, y: 0, age: 0.05, duration: 0.25, frost: false }); });

  title(840, 116, 132);
})();
</script>
</body>
</html>
