<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>色帶圖樣 3 — 薄荷</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<script>
// 色帶圖樣 3(colors.json id 3): 底色 #aaefd5, 紋路 = 遊戲裡的魂件
//   圓角方塊 = 基本魂件、金框八角 + 斜分 = 組合魂件、小菱形 = 魂柱頂的晶石
// 紋路週期 128(整除 256), 每格內的圖形都不碰格邊 → 四邊無縫; 和底色只差一點的同色系
(function () {
  var BG = '#aaefd5', DARK = '#9be3c7', LIGHT = '#bdf6e1';
  var ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = BG; ctx.fillRect(0, 0, 256, 256);
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function oct(cx, cy, R) {
    ctx.beginPath();
    for (var i = 0; i < 8; i++) { var a = Math.PI / 8 + i * Math.PI / 4; ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * R, cy + Math.sin(a) * R); }
    ctx.closePath();
  }
  function gem(cx, cy, s) { ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.7, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s * 0.7, cy); ctx.closePath(); }
  for (var ty = 0; ty < 256; ty += 128) for (var tx = 0; tx < 256; tx += 128) {
    // 基本魂件: 圓角方塊(實心淡塊 + 內框)
    ctx.fillStyle = DARK; rr(tx + 14, ty + 14, 38, 38, 9); ctx.fill();
    ctx.strokeStyle = LIGHT; ctx.lineWidth = 4; rr(tx + 22, ty + 22, 22, 22, 5); ctx.stroke();
    // 組合魂件: 八角外框 + 斜分一半
    ctx.strokeStyle = DARK; ctx.lineWidth = 6; oct(tx + 96, ty + 96, 23); ctx.stroke();
    ctx.save(); oct(tx + 96, ty + 96, 20); ctx.clip();
    ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.moveTo(tx + 120, ty + 72); ctx.lineTo(tx + 120, ty + 120); ctx.lineTo(tx + 72, ty + 120); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 晶石: 小菱形
    ctx.fillStyle = DARK; gem(tx + 96, ty + 33, 13); ctx.fill();
    ctx.fillStyle = LIGHT; gem(tx + 33, ty + 96, 11); ctx.fill();
  }
})();
</script>
</body>
</html>
