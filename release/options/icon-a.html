<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖示 A — 魂匠</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 A「魂匠」: 玩家魂匠(drawPlayer)放大成主體, 背後金色圓環 + 鍛爐暖光; 四角只有深色背景, 不放字
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 512, H = 512, CX = 256, CY = 256, TAU = Math.PI * 2;
  // 背景: 深夜藍(遊戲 HUD / 面板色系), 中央鍛爐暖光
  ctx.fillStyle = '#121725'; ctx.fillRect(0, 0, W, H);
  var g = ctx.createRadialGradient(CX, CY + 10, 20, CX, CY + 10, 300);
  g.addColorStop(0, 'rgba(255,176,32,0.55)'); g.addColorStop(0.45, 'rgba(224,144,42,0.22)'); g.addColorStop(1, 'rgba(224,144,42,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 金色圓環(和開始畫面的玩家記號同一個金環), 半徑 205: 在中間 80% 內
  ctx.strokeStyle = '#2a1a08'; ctx.lineWidth = 22; ctx.beginPath(); ctx.arc(CX, CY, 205, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(CX, CY, 205, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,241,201,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, 196, 0, TAU); ctx.stroke();
  // 環上 8 個魂光小點
  for (var i = 0; i < 8; i++) {
    var a = -Math.PI / 2 + i * TAU / 8;
    ctx.fillStyle = i % 2 ? '#cfe0ff' : '#fff1c9';
    ctx.beginPath(); ctx.arc(CX + Math.cos(a) * 205, CY + Math.sin(a) * 205, i % 2 ? 6 : 8, 0, TAU); ctx.fill();
  }
  // 主體: 玩家魂匠, 放大 11 倍(身體直徑約 320); 身體圓心在單位座標 (0, 1)
  var K = 11;
  ctx.save();
  ctx.translate(CX, CY - 1 * K + 4); ctx.scale(K, K);
  Art.drawPlayer(ctx, { x: 0, y: 0, moving: false, attackAge: 0.15, attackDuration: 0.15, attackKind: 'other', resonating: false, stealing: false, holdingFlag: false, handItem: '' });
  ctx.restore();
  // 胸前一點高光(讓大圓身有體積)
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(CX - 92, CY + 50, 24, 15, -0.9, 0, TAU); ctx.fill();
  ctx.restore();
})();
</script>
</body>
</html>
